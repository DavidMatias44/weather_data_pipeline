services:
  db:
    container_name: postgres_container
    image: postgres:16-alpine
    ports:
      - ${POSTGRES_PORT}:5432
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    networks:
      - wdp_network

  airflow:
    container_name: airflow_container
    build: .
    ports:
      - ${AIRFLOW_PORT}:8080
    env_file: .env
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_USER}:${AIRFLOW_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${AIRFLOW_DB}
      PYTHONPATH: /opt/airflow
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./dbt:/opt/airflow/dbt
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - db
    command: >
      bash -c "airflow db migrate && airflow standalone"
    networks:
      - wdp_network

volumes:
  pgdata:

networks:
  wdp_network:
    driver: bridge
