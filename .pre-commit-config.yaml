repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.16.6
  hooks:
    - id: ruff-check
      args: [ --fix ]

    - id: ruff-format

- repo: https://github.com/sqlfluff/sqlfluff
  rev: 4.3.0
  hooks:
    - id: sqlfluff-lint
      additional_dependencies: ['dbt-postgres', 'sqlfluff-templater-dbt']

    - id: sqlfluff-fix
      additional_dependencies: ['dbt-postgres', 'sqlfluff-templater-dbt']
